# Herdr config — https://herdr.dev
#
# Symlinked to ~/.config/herdr/config.toml by script/install.
# Validate with `herdr config check`; apply to a running server with
# `herdr server reload-config`.

onboarding = false

# ── Theme ─────────────────────────────────────────────────────────────────────
#
# Herdr's built-in themes don't include Monokai (Soda or otherwise), but
# [theme.custom] overrides individual color tokens on top of a base theme.
# Base is "terminal" so anything Herdr draws that isn't in the token list below
# falls through to Ghostty's own Monokai Soda ANSI palette instead of a
# mismatched built-in. The hex values match config/hunk/config.toml.
#
# Token names are Catppuccin-flavored (that's Herdr's default theme); the
# mapping to Soda hues is noted per line. `herdr config check` warns on any
# token it doesn't recognize, so this list is exhaustive as of herdr 0.8.2 —
# except sidebar_bg and selection_bg, which are deliberately left unset so they
# keep following the base theme.

[theme]
name = "terminal"

[theme.custom]
accent        = "#9d65ff"   # purple — highlights, borders, navigate UI
panel_bg      = "#1a1a1a"   # Soda background
# Sidebar's selected row. Unset, "terminal" falls through to Soda's ANSI
# bright-black (#625e4c), which reads as brownish grey. This is Soda's pink-red
# at 50% over surface0 — clearly magenta, and higher contrast than the default.
active_row_bg = "#890f3e"
surface0      = "#1e1e1e"   # sidebar / panel surfaces
surface1      = "#242424"   # raised surfaces
surface_dim   = "#161616"   # recessed surfaces
# Panel chrome — the "spaces"/"agents" headers and the new/menu/grouped labels,
# plus borders and dividers. Soda's selection grey (#343434) is ~1.4:1 on the
# sidebar background, so the labels were unreadable; lifted to ~3.4:1.
overlay0      = "#6f6f6f"
# Dim/muted text. Soda's raw comment color (#625e4c) is only ~1.5:1 against
# active_row_bg, so both are lifted toward the foreground to stay legible on a
# highlighted row while still reading as secondary off it.
overlay1      = "#a2a190"   # dim text
text          = "#d3d4c6"   # Soda foreground, 30% toward its bright-white
subtext0      = "#a2a190"   # muted text — Soda's comment, 65% toward foreground
mauve         = "#9d65ff"   # purple
green         = "#98e024"
yellow        = "#e0d561"
red           = "#f4005f"   # Soda's pink-red
blue          = "#58d1eb"   # Soda has no blue; cyan stands in
teal          = "#58d1eb"   # cyan
peach         = "#fa8419"   # orange

# ── Keys ──────────────────────────────────────────────────────────────────────
#
# NOTE ON cmd+k: clearing the screen with cmd+k is deliberately NOT configured
# here — it can't be. Herdr has no "clear screen" action to bind (ctrl+l works
# because Herdr forwards the raw 0x0c byte to the focused pane's shell, which
# handles it itself). On top of that, Ghostty binds cmd+k to its own
# `clear_screen` action, so the keypress never reaches Herdr at all.
#
# Both problems are solved in one line on the Ghostty side instead — see
# config/ghostty/config, which remaps cmd+k to send the ctrl+l byte:
#
#     keybind = cmd+k=text:\x0c
#
# That works inside Herdr panes, in plain shells, and in any other TUI.

[keys]
# prefix = "ctrl+b"

# ── UI ────────────────────────────────────────────────────────────────────────

[ui.toast]
delivery = "system"

# Sidebar row layouts are Herdr's defaults; the only change is styling the
# secondary tokens. They default to a dim purple that drops to ~1.5:1 against
# active_row_bg — unreadable on a selected row. branch/agent are pinned to Soda's
# cyan (>5:1 on the magenta), and tab to a muted foreground so the first row
# stays a bright workspace name followed by a dimmer-but-legible tab name.

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  [{ token = "branch", fg = "#58d1eb", dim = false }, "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "tab", fg = "#b5b5a6", dim = false }],
  [{ token = "agent", fg = "#58d1eb", dim = false }],
]
