"$schema" = 'https://starship.rs/config-schema.json'

# host:dir (branch!?)  — user@host over SSH

add_newline = false
format = "$username$hostname[:](bold green)$directory($git_branch$git_status[\\)](bold green)) "

[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user@]($style)"

[hostname]
ssh_only = false
ssh_symbol = ""
style = "bold green"
format = "[$hostname]($style)"

[directory]
truncation_length = 1
truncate_to_repo = false
read_only = ""
style = "bold blue"
format = "[$path]($style)"

[git_branch]
format = "[ \\(](bold green)[$branch](purple)"

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style))"
